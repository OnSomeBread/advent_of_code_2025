cargo-features = ["trim-paths", "codegen-backend"]
[package]
name = "advent_of_code_2025"
version = "0.1.0"
edition = "2024"

[dependencies]
mimalloc = { version = "0.1.48", default-features = false }
tracing = { version = "0.1.43", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "ansi",
] }
tracing-appender = { version = "0.2.4", default-features = false }
rayon = "1.11.0"
ahash = "0.8.12"
smallvec = "1.15.1"
itertools = "0.14.0"
good_lp = { version = "1.14.2", default-features = false, features = [
    "minilp",
] }
#anyhow = "1.0.100"
#dashmap = { version = "6.1.0", features = ["rayon"] }
#serde = { version = "1.0.228", features = ["derive"] }
#serde_json = "1.0.145"

[dev-dependencies]
function_name = "0.3.0"
divan = "0.1.21"
proptest = "1.9.0"

[[bench]]
name = "bench"
harness = false

[profile.dev]
codegen-backend = "cranelift"

[profile.test]
codegen-backend = "cranelift"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
trim-paths = "all"
