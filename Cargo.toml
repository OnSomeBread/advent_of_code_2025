cargo-features = ["trim-paths", "codegen-backend"]
[package]
name = "advent_of_code_2025"
version = "0.1.0"
edition = "2024"

[dependencies]
mimalloc = { version = "0.1.48", default-features = false }
rayon = "1.11.0"
ahash = "0.8.12"
smallvec = "1.15.1"
#serde = { version = "1.0.228", features = ["derive"] }
#serde_json = "1.0.145"

[profile.dev]
codegen-backend = "cranelift"

[dev-dependencies]
function_name = "0.3.0"
divan = "0.1.21"

[[bench]]
name = "bench"
harness = false

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
trim-paths = "all"
